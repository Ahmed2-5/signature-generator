<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signature Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Pacifico&family=Sacramento&family=Pinyon+Script&family=Alex+Brush&family=Allura&family=Berkshire+Swash&family=Libre+Baskerville&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Libre Baskerville', serif; padding: 30px 16px;
    }
    .container { width: 100%; max-width: 750px; }
    h1 { text-align: center; color: #e2c97e; font-size: 2rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 6px; }
    .subtitle { text-align: center; color: #8892b0; font-size: 0.85rem; margin-bottom: 36px; letter-spacing: 1px; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(226,201,126,0.15); border-radius: 20px; padding: 36px 32px; backdrop-filter: blur(10px); }
    .inputs { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .inputs input { flex: 1; min-width: 160px; padding: 14px 18px; border-radius: 12px; border: 1px solid rgba(226,201,126,0.25); background: rgba(255,255,255,0.06); color: #ccd6f6; font-size: 1rem; outline: none; transition: border 0.2s; }
    .inputs input::placeholder { color: #495670; }
    .inputs input:focus { border-color: #e2c97e; }
    button#generate { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(90deg, #e2c97e, #c9a84c); color: #1a1a2e; font-size: 1rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: opacity 0.2s, transform 0.1s; }
    button#generate:hover { opacity: 0.9; transform: translateY(-1px); }
    .signatures { margin-top: 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 520px) { .signatures { grid-template-columns: 1fr; } }
    .sig-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(226,201,126,0.12); border-radius: 14px; padding: 24px 20px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; }
    .sig-card:hover { border-color: rgba(226,201,126,0.5); background: rgba(255,255,255,0.07); transform: translateY(-2px); }
    .sig-card.selected { border-color: #e2c97e; background: rgba(226,201,126,0.07); }
    .sig-text { color: #ffffff; line-height: 1.3; }
    .sig-label { margin-top: 12px; font-size: 0.7rem; color: #495670; letter-spacing: 1.5px; text-transform: uppercase; }
    .check { position: absolute; top: 10px; right: 12px; color: #e2c97e; display: none; }
    .sig-card.selected .check { display: block; }
    .actions { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; }
    .actions button { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid rgba(226,201,126,0.3); background: transparent; color: #e2c97e; font-size: 0.85rem; letter-spacing: 1px; cursor: pointer; transition: background 0.2s; }
    .actions button:hover { background: rgba(226,201,126,0.1); }
    .hidden { display: none; }
    canvas { display: none; }
    #preview-section { margin-top: 28px; }
    .preview-box { background: #fff; border-radius: 14px; padding: 40px 30px; text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,0.4); }
  </style>
</head>
<body>
<div class="container">
  <h1>✍️ Signature Generator</h1>
  <p class="subtitle">Enter your name and discover your perfect signature</p>
  <div class="card">
    <div class="inputs">
      <input type="text" id="firstname" placeholder="First name" />
      <input type="text" id="lastname" placeholder="Last name" />
    </div>
    <button id="generate">✨ Generate Signatures</button>
    <div id="sig-grid" class="signatures hidden"></div>
    <div id="preview-section" class="hidden">
      <div class="preview-box">
        <div id="preview-text"></div>
      </div>
      <div class="actions">
        <button onclick="downloadPNG()">⬇ Download PNG</button>
        <button onclick="copySVG()">📋 Copy as SVG</button>
      </div>
    </div>
  </div>
</div>
<canvas id="canvas"></canvas>
<script>
  const styles = [
    { font: "'Great Vibes', cursive",     size: "2.8rem", label: "Elegant Classic",  color: "#1a1a2e" },
    { font: "'Pinyon Script', cursive",   size: "2.6rem", label: "Victorian Ink",    color: "#2c1810" },
    { font: "'Sacramento', cursive",      size: "2.6rem", label: "Flowing Grace",    color: "#1a1a2e" },
    { font: "'Dancing Script', cursive",  size: "2.2rem", label: "Modern Cursive",   color: "#0d1b2a" },
    { font: "'Allura', cursive",          size: "2.6rem", label: "Romantic Script",  color: "#1a0a2e" },
    { font: "'Alex Brush', cursive",      size: "2.4rem", label: "Executive Brush",  color: "#1a1a2e" },
    { font: "'Pacifico', cursive",        size: "1.9rem", label: "Bold & Friendly",  color: "#0f2027" },
    { font: "'Berkshire Swash', cursive", size: "1.9rem", label: "Regal Swash",      color: "#1a1a2e" },
  ];
  let selectedStyle = null, fullName = "";

  document.getElementById('generate').addEventListener('click', generate);
  document.addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });

  function generate() {
    const first = document.getElementById('firstname').value.trim();
    const last  = document.getElementById('lastname').value.trim();
    if (!first && !last) return;
    fullName = (first + ' ' + last).trim();
    selectedStyle = null;
    const grid = document.getElementById('sig-grid');
    grid.innerHTML = ''; grid.classList.remove('hidden');
    document.getElementById('preview-section').classList.add('hidden');
    styles.forEach(s => {
      const card = document.createElement('div');
      card.className = 'sig-card';
      card.innerHTML = `<span class="check">✓</span>
        <div class="sig-text" style="font-family:${s.font};font-size:${s.size}">${fullName}</div>
        <div class="sig-label">${s.label}</div>`;
      card.addEventListener('click', () => {
        document.querySelectorAll('.sig-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected'); selectedStyle = s; showPreview(s);
      });
      grid.appendChild(card);
    });
  }

  function showPreview(s) {
    const pt = document.getElementById('preview-text');
    pt.style.cssText = `font-family:${s.font};font-size:3.2rem;color:${s.color}`;
    pt.textContent = fullName;
    const sec = document.getElementById('preview-section');
    sec.classList.remove('hidden');
    sec.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function downloadPNG() {
    if (!selectedStyle) { alert("Please select a style first!"); return; }
    const c = document.getElementById('canvas'), ctx = c.getContext('2d');
    c.width = 900; c.height = 250;
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,900,250);
    ctx.font = `80px ${selectedStyle.font}`; ctx.fillStyle = selectedStyle.color;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(fullName, 450, 125);
    const a = document.createElement('a');
    a.download = 'my-signature.png'; a.href = c.toDataURL(); a.click();
  }

  function copySVG() {
    if (!selectedStyle) { alert("Please select a style first!"); return; }
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="150">
  <text x="300" y="100" text-anchor="middle" font-family="${selectedStyle.font}" font-size="60" fill="${selectedStyle.color}">${fullName}</text>
</svg>`;
    navigator.clipboard.writeText(svg).then(() => alert("SVG copied to clipboard!"));
  }
</script>
</body>
</html>
